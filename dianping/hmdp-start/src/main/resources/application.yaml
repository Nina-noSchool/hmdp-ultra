server:
  port: 8081
  tomcat:
    threads:
      max: 800
      min-spare: 100
    accept-count: 500

dewu:
  compensation:
    retry:
      max-retry-count: 3

spring:
  main:
    allow-circular-references: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
#      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dingping}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 15
          min-idle: 5
          max-wait: -1ms
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: seckill-plus-tx-producer-group
    # 默认 3000ms 在 4000 并发下会让大量 syncSend 超时（客户端日志可见
    # "send request failed to <broker>:10911"），消息发不进 broker 就只有一半能落库。
    send-message-timeout: 10000
  consumer:
    pull-batch-size: 32

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.hmdp.entity,com.hmdp.shopdetail.infrastructure.persistence.dataobject,com.hmdp.shared.infrastructure.persistence.dataobject
  type-enums-package: com.hmdp.orderverify.model;com.hmdp.shared.reconciliation.model;com.hmdp.shared.domain.compensation.model
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.hmdp: debug

seckill:
  reconcile:
    enabled: true
    auto-compensation-enabled: false
    scan-batch-size: 100
    scan-delay-minutes: 3
    compensation-max-retry-count: 5
    compensation-retry-delay-seconds: 30
  # ===== 批次1 ①：秒杀入口滑动窗口限流（可开关，供压测对比实验） =====
  rate-limit:
    sliding-window:
      enabled: true
      window-ms: 1000
      max-requests: 5
  # ===== 批次1 ⑤：本地消息表重试上限（达到后转 FAILED 终态，人工介入） =====
  mq-event:
    max-retry-count: 5
  # ===== 消费端批量建单快路径（默认关 = 单笔链路历史行为不变） =====
  # 开启后整批消息在一个事务里"库存一次扣 N + 订单/对账日志批量写入"，
  # 快路径异常整体回滚并逐条退回单笔链路；对账/兜底体系零变化。
  consumer:
    batch:
      enabled: false

# ===== 批次3 ②：多级缓存开关（L1 本地 Caffeine；false=完全回退单级 Redis 逻辑过期链路） =====
cache:
  local:
    enabled: true

# ===== 批次4：店铺布隆前置守卫（Redis BitMap 手写布隆；fail-open，未初始化/异常时放行） =====
# 误判"存在"的请求落到负缓存兜底，绝不误杀真实数据；参数按店铺量级 10 万/1% 计算
bloom:
  shop:
    enabled: true
    key: "bloom:shop"
    expected-insertions: 100000
    fpp: 0.01

# ===== 无忧闪赔赔付配置 =====
flash-pay:
  payout-rules:
    FLASH_PAY: 50
  max-payout: 500
  payment:
    mock-mode: SUCCESS   # SUCCESS / FAIL / REJECT
